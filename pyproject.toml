[project]
name = "jevkit"
version = "0.1.0"
description = "TypeSafe Jev as a bounded judgement layer for computer use: verify, pick, classify over Cua Driver and phone-harness observations"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["typesafe-sdk>=0.6"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
jev = "jevkit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jevkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
